name: APEX Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APEX_ENGINE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APEX_ENGINE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Canonical Validator (V26 baseline)
        run: npm run validate

      - name: Combat Engine Tests
        run: npm test

      - name: Build
        run: npm run build
